# One-click deploy on Render (render.com → New → Blueprint → pick this repo).
# Runs the site + admin API, with a persistent disk for the SQLite database.
services:
  - type: web
    name: kartona
    runtime: node
    plan: starter            # always on; the free plan sleeps and has no disk
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/content
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_ID          # Render asks for these on first deploy
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: SITE_URL
        value: https://kartona.onrender.com   # change to your domain later
    disk:
      name: kartona-data
      mountPath: /var/data
      sizeGB: 1
